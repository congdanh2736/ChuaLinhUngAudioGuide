<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu | Quản trị Chùa Linh Ứng</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
    <main class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="sidebar-brand-mark">LU</span>
                <span>Chùa Linh Ứng</span>
            </div>
            <h1 class="login-title">Đổi mật khẩu</h1>
            <p class="login-subtitle">Dành cho quản trị viên và nhân viên quầy vé.</p>
            <div class="alert alert-danger" id="errorBox" role="alert"></div>
            <div class="alert alert-success" id="successBox" role="status"></div>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label" for="userName">Tên đăng nhập</label>
                    <input class="input" id="userName" name="userName" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="oldPassword">Mật khẩu hiện tại</label>
                    <input class="input" type="password" id="oldPassword" name="oldPassword" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="newPassword">Mật khẩu mới (tối thiểu 8 ký tự)</label>
                    <input class="input" type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input class="input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Đổi mật khẩu</button>
            </form>
            <p class="text-sm mt-4 text-center"><a href="/admin/login.html">← Quay lại đăng nhập</a></p>
        </div>
    </main>

    <script type="module">
        import { authApi } from "../assets/js/api/authApi.js";
        import { getUser } from "../assets/js/core/auth.js";
        import { setLoading } from "../assets/js/core/utils.js";

        const form = document.getElementById("changePasswordForm");
        const errorBox = document.getElementById("errorBox");
        const successBox = document.getElementById("successBox");
        const button = document.getElementById("btnSubmit");

        // Điền sẵn tên đăng nhập (từ trang đăng nhập hoặc tài khoản đang đăng nhập)
        const presetUser = new URLSearchParams(window.location.search).get("userName") || getUser()?.userName || "";
        form.userName.value = presetUser;
        (presetUser ? form.oldPassword : form.userName).focus();

        // Lấy lỗi đầu tiên theo từng ô (FluentValidation trả về errors: { Field: [..] })
        function firstFieldError(err) {
            if (!err.errors || typeof err.errors !== "object") return null;
            const first = Object.values(err.errors).flat()[0];
            return first || null;
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            errorBox.textContent = "";
            successBox.textContent = "";

            const data = {
                userName: form.userName.value.trim(),
                oldPassword: form.oldPassword.value,
                newPassword: form.newPassword.value,
                confirmPassword: form.confirmPassword.value
            };
            if (data.newPassword !== data.confirmPassword) {
                errorBox.textContent = "Mật khẩu xác nhận không khớp.";
                form.confirmPassword.focus();
                return;
            }
            if (data.newPassword === data.oldPassword) {
                errorBox.textContent = "Mật khẩu mới phải khác mật khẩu hiện tại.";
                form.newPassword.focus();
                return;
            }

            setLoading(button, true, "Đang xử lý...");
            try {
                // POST /api/auth/change-password-by-login -> AuthController -> AuthService (Identity đổi mật khẩu)
                await authApi.changePasswordByLogin(data);
                form.reset();
                form.userName.value = data.userName;
                successBox.textContent = "Đổi mật khẩu thành công. Đang chuyển về trang đăng nhập...";
                setTimeout(() => window.location.replace("/admin/login.html"), 1500);
            } catch (err) {
                errorBox.textContent = firstFieldError(err) || err.message;
                form.oldPassword.value = "";
                form.newPassword.value = "";
                form.confirmPassword.value = "";
                form.oldPassword.focus();
            } finally {
                setLoading(button, false);
            }
        });
    </script>
</body>
</html>
