<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng quan | Quản trị Chùa Linh Ứng</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
    <style>
        .status-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) 0; }
        .status-row + .status-row { border-top: 1px solid var(--color-border); }
        .bar-track { height: 8px; border-radius: 999px; background: var(--color-secondary-soft); overflow: hidden; margin-top: var(--space-2); }
        .bar-fill { height: 100%; background: var(--color-primary); border-radius: 999px; }
        .codes-by-day { max-height: 420px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="admin-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="admin-main">
            <header id="topbar" class="topbar"></header>
            <main class="admin-content">
                <div class="page-header">
                    <div>
                        <h1>Tổng quan</h1>
                        <p class="page-subtitle">Tình hình nội dung đa ngôn ngữ, mã truy cập và hoạt động của du khách.</p>
                    </div>
                    <div class="page-actions">
                        <button type="button" class="btn btn-secondary" id="btnReload">Tải lại</button>
                        <button type="button" class="btn btn-primary" id="btnLocalizeAll" data-role="admin">Dịch + tạo audio tất cả</button>
                    </div>
                </div>

                <div class="stat-grid" id="statGrid"></div>

                <div class="grid-2 mb-4">
                    <div class="card">
                        <div class="card-header"><div class="card-title">Trạng thái bản dịch</div><span class="text-muted text-sm" id="coverageText"></span></div>
                        <div class="card-body" id="locStatus"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">Phiên truy cập</div></div>
                        <div class="card-body" id="sessionStatus"></div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header"><div class="card-title">Mã truy cập được tạo theo ngày</div><span class="text-muted text-sm" id="codesByDaySummary"></span></div>
                    <form class="toolbar" id="codesByDayForm">
                        <label class="text-sm" for="codesFrom">Từ ngày</label>
                        <input class="input" type="date" id="codesFrom" style="width:auto">
                        <label class="text-sm" for="codesTo">Đến ngày</label>
                        <input class="input" type="date" id="codesTo" style="width:auto">
                        <button type="submit" class="btn btn-secondary btn-sm">Xem</button>
                    </form>
                    <div id="codesByDay" class="codes-by-day"></div>
                </div>

                <div class="grid-2 mb-4">
                    <div class="card">
                        <div class="card-header"><div class="card-title">Điểm được quan tâm nhất</div></div>
                        <div id="topPois"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">Ngôn ngữ du khách dùng</div></div>
                        <div class="card-body" id="eventsByLang"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><div class="card-title">Câu hỏi chatbot gần đây</div></div>
                    <div id="chatLogs"></div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="/admin/js/dashboard.js"></script>
</body>
</html>
