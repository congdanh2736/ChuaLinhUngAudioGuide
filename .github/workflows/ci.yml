# CI - Continuous Integration
# Chạy mỗi khi push hoặc mở Pull Request: kiểm tra code style -> test từng lớp -> build Docker.
# PR chỉ được merge khi tất cả job xanh (bật "Branch protection" cho nhánh main).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.8.4
      - name: Kiểm tra lỗi code
        run: ruff check .
      - name: Kiểm tra định dạng code
        run: ruff format --check .

  test:
    name: Unit test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test lớp API (mock Service)
        run: pytest tests/test_api -q
      - name: Test lớp Service (nghiệp vụ)
        run: pytest tests/test_services -q
      - name: Test lớp Repository (SQLite, bật kiểm tra khóa ngoại)
        run: pytest tests/test_repositories -q
      - name: Test toàn bộ + đo độ phủ (tối thiểu 80%)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Integration test (toàn bộ test trên SQL Server 2022 thật)
    needs: lint
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiStrongPassw0rd2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiStrongPassw0rd2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 20s
    env:
      TEST_DATABASE_URL: mssql+aioodbc://sa:CiStrongPassw0rd2026@localhost:1433/audio_guide_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cài ODBC Driver 18 for SQL Server (nếu runner chưa có)
        run: |
          if odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            echo "Runner đã có ODBC Driver 18"
          else
            # --yes: ghi đè keyring nếu runner đã có sẵn (thiếu cờ này gpg dừng với exit code 2)
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc
          fi
          odbcinst -q -d
      - run: pip install -r requirements-dev.txt
      - name: Toàn bộ test (repository, khóa ngoại, service, E2E, khởi động lại) trên SQL Server
        run: pytest -q

  docker:
    name: Build Docker image + smoke test
    needs: [test, integration]
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiStrongPassw0rd2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiStrongPassw0rd2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 20s
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: audio-guide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chạy container và gọi /health
        run: |
          docker run -d --name app --network host \
            -e "DATABASE_URL=mssql+aioodbc://sa:CiStrongPassw0rd2026@localhost:1433/audio_guide?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" \
            -e TRANSLATOR_PROVIDER=none -e TTS_PROVIDER=none audio-guide:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then echo; echo "Container OK"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
