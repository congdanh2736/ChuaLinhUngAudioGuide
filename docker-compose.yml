# Chạy đầy đủ backend + SQL Server thật trên máy:  docker compose up --build
# Chỉ chạy SQL Server (để chạy backend bằng uvicorn trên máy):  docker compose up -d sqlserver
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      # Máy đã cài SQL Server chiếm cổng 1433 -> mở ra ngoài bằng 14330 để không đụng nhau.
      # Container api vẫn nối vào sqlserver:1433 bên trong mạng Docker. SSMS: localhost,14330 (user sa)
      - "14330:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mssql+aioodbc://sa:${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}@sqlserver:1433/audio_guide?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      MEDIA_STORAGE: database   # audio lưu trong SQL Server -> chỉ cần giữ volume của sqlserver

volumes:
  mssql_data:
